<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Wanderlust</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <span style="font-size:1.6rem;">🌍</span>
      <span>Wanderlust</span>
    </div>
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Sign in to access your travel plans</p>

    <div class="alert alert-error" id="auth-alert"></div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <input class="form-input" type="email" id="email" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-full" style="margin-top:0.5rem;padding:0.9rem;">Sign in</button>
    </form>

    <p class="auth-footer-link">
      Don't have an account? <a href="/register">Create one free</a>
    </p>
    <p class="auth-footer-link" style="margin-top:0.5rem;">
      <a href="/" style="color:rgba(255,255,255,0.4);font-size:0.8rem;">← Back to home</a>
    </p>
  </div>
</div>

<script src="/js/app.js"></script>
</body>
</html>
