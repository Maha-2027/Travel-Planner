<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account — Wanderlust</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <span style="font-size:1.6rem;">🌍</span>
      <span>Wanderlust</span>
    </div>
    <h1 class="auth-title">Start exploring</h1>
    <p class="auth-subtitle">Create your free account and start planning</p>

    <div class="alert alert-error" id="auth-alert"></div>
    <div class="alert alert-success" id="auth-success" style="display: none;"></div>

    <form id="register-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="name">Full name</label>
        <input class="form-input" type="text" id="name" placeholder="Jane Smith" required autocomplete="name">
      </div>
      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <input class="form-input" type="email" id="email" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password <span style="opacity:0.5;font-weight:400">(min. 6 characters)</span></label>
        <input class="form-input" type="password" id="password" placeholder="Choose a strong password" required autocomplete="new-password" minlength="6">
      </div>
      <button type="submit" class="btn btn-primary btn-full" style="margin-top:0.5rem;padding:0.9rem;">Create account</button>
    </form>

    <p class="auth-footer-link">
      Already have an account? <a href="/login">Sign in</a>
    </p>
    <p class="auth-footer-link" style="margin-top:0.5rem;">
      <a href="/" style="color:rgba(255,255,255,0.4);font-size:0.8rem;">← Back to home</a>
    </p>
  </div>
</div>

<script src="/js/app.js"></script>
</body>
</html>
